[from-nvoip]
; A Nvoip liga para o nosso ramal (perna de origem do click-to-call).
; Atendemos e repetimos o áudio, para que ele ainda esteja tocando
; quando a plataforma conectar o cliente do outro lado.
exten => _.,1,NoOp(CHAMADA RECEBIDA DA NVOIP: ${CALLERID(all)} -> ${EXTEN})
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(aviso)
 same => n,Wait(2)
 same => n,Playback(aviso)
 same => n,Wait(2)
 same => n,Playback(aviso)
 same => n,Wait(2)
 same => n,Playback(aviso)
 same => n,Hangup()

[aviso-saida]
exten => s,1,Answer()
 same => n,Wait(1)
 same => n,Playback(aviso)
 same => n,Wait(1)
 same => n,Hangup()
